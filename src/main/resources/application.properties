# Spring assim que a aplicacao sobe, e diz "como" ela deve rodar (banco, comportamento do JPA, etc.).

spring.application.name=TechSupport

# Endereco do banco PostgreSQL que o back vai usar (nome do banco: TechSupport).
spring.datasource.url=jdbc:postgresql://localhost/TechSupport
spring.datasource.username=postgres
spring.datasource.password=Sen@c2023
spring.datasource.driver-class-name=org.postgresql.Driver

# update: o Hibernate olha as classes @Entity e cria/ajusta as tabelas do banco sozinho, sem apagar dados.
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL que o Hibernate esta° executando (bom pra acompanhar o que esta° acontecendo).
spring.jpa.show-sql=true

# Propriedades nossas, usadas pela classe TokenService para gerar o token de login (JWT).
