# ==========================================================================
# ARQUIVO: application.properties (configurações do Spring Boot)
# O Spring lê este arquivo quando a aplicação sobe. As propriedades "spring.*" de
# datasource/jpa são lidas pelo próprio Spring; as 3 últimas (expiracao, secret, emissor)
# são propriedades NOSSAS, lidas na classe TokenService com @Value("${...}").
# ==========================================================================

# Nome da aplicação (aparece em logs; não muda o funcionamento).
spring.application.name=TechSupport


# URL de conexão JDBC com o PostgreSQL: banco rodando na própria máquina (localhost),
# porta padrão 5432 (omitida) e o banco chamado "TechSupport" (precisa existir antes de subir).
spring.datasource.url=jdbc:postgresql://localhost/TechSupport
# Usuário e senha do PostgreSQL.
spring.datasource.username=postgres
spring.datasource.password=Sen@c2023
# Classe do driver que "fala" com o PostgreSQL (vem da dependência do pom.xml).
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update: o Hibernate compara as classes @Entity com o banco e cria/altera tabelas e
# colunas que faltarem, sem apagar dados. É por isso que não existe script SQL no projeto.
# (Outras opções: none, validate, create, create-drop.)
spring.jpa.hibernate.ddl-auto=update
# Mostra no console cada SQL que o Hibernate gera (bom para estudar/depurar).
spring.jpa.show-sql=true

# Tempo de validade do token JWT, em MINUTOS (TokenService faz plusMinutes(expiracao)).
spring.expiracao =5
# Chave secreta usada para ASSINAR o token (HMAC256). Quem tem essa chave consegue gerar tokens válidos.
# (As aspas fazem parte do valor, mas como o mesmo valor é usado ao gerar e ao verificar, funciona.)
spring.secret ="auvblavnb"
# Emissor do token (campo "iss" do JWT). Ao verificar, o token só vale se o emissor for este.
spring.emissor = "alunovitor"